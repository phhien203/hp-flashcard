  '@arethetypeswrong/cli': 0.18.5
  '@base-ui/react': 1.9.0
  '@changesets/changelog-github': 1.0.1
  '@changesets/cli': 3.0.3
  '@eslint/js': 10.0.1
  '@storybook/addon-a11y': 10.6.7
  '@storybook/addon-docs': 10.6.7
  '@storybook/addon-vitest': 10.6.7
  '@storybook/react-vite': 10.6.7
  '@tailwindcss/cli': 4.3.5
  '@tailwindcss/vite': 4.3.5
  '@types/node': 24.19.2
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  '@vitejs/plugin-react': 6.3.0
  '@vitest/browser': 5.1.0
  '@vitest/browser-playwright': 5.1.0
  class-variance-authority: 0.7.1
  cn: 0.5.2
  eslint: 10.14.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-storybook: 10.6.7
  globals: 17.14.0
  husky: 9.1.7
  lint-staged: 17.6.0
  playwright: 1.65.0
  prettier: 3.9.10
  prettier-plugin-tailwindcss: 0.8.1
  publint: 0.3.25
  react: 19.3.1
  react-dom: 19.3.1
  shadcn: 4.23.0
  storybook: 10.6.7
  tailwindcss: 4.3.5
  tsx: 4.23.15
  typescript: 6.0.3
  typescript-eslint: 8.72.2
  vite: 8.3.7
  vitest: 5.1.0
  vitest-browser-react: 2.3.0

