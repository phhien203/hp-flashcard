name: Agent — Explore The Tickets (GPT)

on:
  issues:
    types: [labeled]

permissions:
  contents: read

jobs:
  explore:
    if: github.event.label.name == 'agent:explore:gpt'
    uses: ./.github/workflows/agent-explore.yml
    with:
      gpt: true
    secrets:
      FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
