name: Agent — Implement A Ticket (GPT)

on:
  issues:
    types: [labeled]

permissions:
  contents: read

jobs:
  implement:
    if: github.event.label.name == 'agent:implement:gpt'
    uses: ./.github/workflows/agent-implement.yml
    with:
      gpt: true
    secrets:
      FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
