name: Agent — Review A Pull Request (GPT)

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  review:
    if: github.event.label.name == 'agent:review:gpt'
    uses: ./.github/workflows/agent-review.yml
    with:
      gpt: true
    secrets:
      FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
