name: Agent — Implement A Spec

# Existing native sub-issues are the queue; native blocked-by edges are the
# dependencies. Planning is a human step, not something this workflow repeats.
# Builds are serialized, and tickets close through merged PRs, not draft PRs.
# A failure pauses the spec with agent:blocked until a person investigates.
on:
  issues:
    types: [labeled]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      spec_issue:
        description: 'Spec issue with existing native sub-issues; blank selects a labelled spec.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name != 'issues' || github.event.label.name == 'agent:implement-spec') && 'agent-implement-spec' || format('ignore-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  survey:
    if: >-
      github.event_name != 'issues' ||
      github.event.label.name == 'agent:implement-spec'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.survey.outputs.mode }}
      spec: ${{ steps.survey.outputs.spec }}
      ticket: ${{ steps.survey.outputs.ticket }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Find an existing, unblocked ticket
        id: survey
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_SPEC: ${{ github.event.issue.number || inputs.spec_issue }}
        run: node scripts/implement-spec.mjs

  implement:
    needs: survey
    if: needs.survey.outputs.mode == 'implement'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_REPO: ${{ github.repository }}
      SPEC: ${{ needs.survey.outputs.spec }}
      TICKET: ${{ needs.survey.outputs.ticket }}
      BRANCH: agent/spec-${{ needs.survey.outputs.spec }}-ticket-${{ needs.survey.outputs.ticket }}-${{ github.run_id }}
      RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm, Node.js and dependencies
        uses: ./.github/actions/setup

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Claim the ticket
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
        run: |
          set -euo pipefail
          gh label create "agent:in-progress" --color FBCA04 \
            --description "An agent is building this ticket" --force
          gh issue edit "$TICKET" --add-label "agent:in-progress"
          gh issue comment "$TICKET" --body "Building — [logs](${RUN_URL}). <!-- factory:status -->"

      - name: Read the ticket and its spec
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
        run: |
          set -euo pipefail
          # Only collaborator comments reach the agent. Factory status is not
          # an instruction, even when posted using the owner's PAT.
          gh issue view "$TICKET" --json number,title,body,comments \
            | jq '.comments |= map(select(
                (.authorAssociation | IN("OWNER", "MEMBER", "COLLABORATOR"))
                and (.body | contains("<!-- factory:status -->") | not)))' \
            > /tmp/ticket.json
          jq -r '
            "# " + .title + "\n\n" + .body
            + (if (.comments | length) > 0
               then "\n\n## Comments\n"
                 + ([.comments[] | "\n### " + .author.login + " (" + .createdAt + ")\n\n" + .body + "\n"] | join(""))
               else "" end)
          ' /tmp/ticket.json > /tmp/ticket.md
          gh issue view "$SPEC" --json title,body \
            --jq '"# Spec: " + .title + "\n\n" + .body' > /tmp/spec.md

      - name: Open the branch
        id: branch
        run: |
          set -euo pipefail
          git config user.name "agent-factory[bot]"
          git config user.email "agent-factory[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$(git config core.hooksPath)" != ".husky/_" ]; then
            echo "::error::The pre-commit hook is not installed."
            exit 1
          fi

      - name: Build the ticket
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        # No automatic replay: the agent may have edited or committed before
        # a remote failure. A person decides whether and how to retry.
        run: pnpm exec tsx .sandcastle/agent-workflows/implement-spec/build.ts

      - name: Preserve screenshots and summary
        if: always()
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: ticket-${{ env.TICKET }}-evidence
          path: |
            /tmp/evidence/
            /tmp/pr-body.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Check the agent committed
        env:
          BASE: ${{ steps.branch.outputs.base }}
        run: |
          set -euo pipefail
          if [ "$(git rev-list --count "$BASE..HEAD")" -eq 0 ]; then
            echo "::error::The agent finished without committing."
            exit 1
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The agent left uncommitted changes."
            git status --short
            exit 1
          fi

      - name: Push
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
        run: |
          set -euo pipefail
          # The PAT is step-scoped; hooks are disabled only for this push.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c core.hooksPath=/dev/null \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push "https://github.com/${GH_REPO}.git" "HEAD:refs/heads/${BRANCH}"

      - name: Open the draft PR
        id: ship
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          set -euo pipefail
          title=$(gh issue view "$TICKET" --json title --jq .title)
          [ -s /tmp/pr-body.md ] || echo "Built by the implement-spec workflow." > /tmp/pr-body.md
          {
            echo ""
            echo "---"
            echo ""
            echo "Closes #${TICKET}. Part of spec #${SPEC}."
            echo "Built unattended by [this run](${RUN_URL}); awaiting review and merge."
            if [ -n "$EVIDENCE_URL" ]; then
              echo "Screenshots and summary: [workflow artifact](${EVIDENCE_URL}) (retained for 14 days)."
            fi
          } >> /tmp/pr-body.md
          url="$(gh pr create --draft \
            --base "${{ github.event.repository.default_branch || 'main' }}" \
            --head "$BRANCH" --title "$title" --body-file /tmp/pr-body.md)"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Hand the pull request to the reviewer
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
        run: |
          set -euo pipefail
          gh label create "agent:review" --color 5319E7 \
            --description "Ask the review workflow to review this pull request" --force
          gh pr edit "$BRANCH" --add-label "agent:review"

      - name: Release the claim and report
        if: always()
        env:
          GH_TOKEN: ${{ secrets.FACTORY_PAT }}
          RESULT: ${{ job.status }}
          PR_URL: ${{ steps.ship.outputs.url }}
        run: |
          set -euo pipefail
          gh issue edit "$TICKET" --remove-label "agent:in-progress"
          if [ "$RESULT" = "success" ]; then
            gh issue comment "$TICKET" --body \
              "Draft PR: ${PR_URL}. This ticket stays open until merge; the next scheduled survey resumes the queue. <!-- factory:status -->"
          else
            gh label create "agent:blocked" --color B60205 \
              --description "Paused until a person investigates" --force
            gh issue edit "$SPEC" --add-label "agent:blocked"
            gh issue edit "$TICKET" --add-label "agent:blocked"
            gh issue comment "$SPEC" --body \
              "Implementation of #${TICKET} stopped (**${RESULT}**): [logs](${RUN_URL}). The spec is paused. Resolve the failure, then remove agent:blocked from the spec and ticket to retry. <!-- factory:status -->"
          fi

# No self-dispatch chain. The schedule (or a manual dispatch) surveys again.
# A draft/open PR gates the queue; a failed build pauses the parent spec.
