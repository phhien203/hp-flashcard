openapi: 3.1.0
info:
  title: hp-flashcard API
  version: 0.1.0
  summary: Cards and their Categories.
  description: |
    The REST API the hp-flashcard app consumes. This document is the source
    of truth: the app's TypeScript API types are generated from it, and the
    mock backend (MSW) implements it.

    Vocabulary follows GLOSSARY.md: a **Card** has a question, an answer and
    exactly one **Category**; **Progress** runs from 0 to 5, and a Card at
    5/5 is **Mastered**. Categories exist only through Cards.

    Every operation acts on the signed-in person's private **Collection**:
    send a Clerk session token as `Authorization: Bearer <token>`. The owner
    is always the verified token's subject; no request field can name
    another. A missing, expired, malformed or otherwise invalid token gets
    `401` before any data is read or written.

    Errors use one shape, `Error`. Validation failures (`400`) also carry
    `fieldErrors`, keyed by the request body field, query parameter or
    header name.

    Text limits are counted in Unicode code points after trimming (as JSON
    Schema's `maxLength` counts): 2,000 for a question, 10,000 for an
    answer and 100 for a Category name. Trimming removes ECMAScript white
    space and line terminators at either end. Text containing a lone UTF-16
    surrogate or a NUL character (U+0000) is rejected. Text is stored as sent, without Unicode
    normalization.

    Every Card has a `contentVersion`, which each content edit advances.
    Edits and deletions name the version they were based on in `If-Match`
    (e.g. `If-Match: "3"`); when the Card has changed since, they answer
    `409` with `version_conflict` and change nothing, so no device silently
    overwrites another's edit. Fetch the Card again to review it.

    Every write takes an `Idempotency-Key`. For 24 hours the backend
    remembers a completed write under your account, the operation and the
    key: repeating it answers the original success again, marked
    `Idempotent-Replayed: true`, without applying it twice, even if the
    Card has since changed or been deleted. A replayed response describes
    the past: don't let it replace newer data you hold.

    Responses are private to the signed-in person: they carry
    `Cache-Control: private, no-store`, so no shared cache keeps them.

    Operations this backend does not support yet answer `501` with
    `not_implemented`; they never report a write that did not happen.
servers:
  - url: /
security:
  - clerkSession: []
tags:
  - name: Cards
  - name: Categories

paths:
  /api/cards:
    get:
      tags: [Cards]
      operationId: listCards
      summary: List matching Cards, one page at a time
      description: |
        Returns a page of the Cards that match the filters. With no `seed`,
        Cards come in the default order: most recently created first. With a
        `seed`, the whole matching collection is shuffled by that seed before
        it is paged, so requesting the next pages with the same filters and
        `seed` continues the same order, without duplicates or omissions,
        while the collection is unchanged. A Card's place in a shuffled
        order depends only on the `seed` and the Card's identifier, so
        creating, editing or deleting a Card leaves the other Cards in the
        same relative order.
      parameters:
        - name: category
          in: query
          description: |
            Category identifiers. A Card matches when its Category is any of
            them. Omit to match every Category. Identifiers that name no
            Category match nothing.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CategoryId'
          style: form
          explode: true
        - name: hideMastered
          in: query
          description: Exclude Mastered Cards (Progress 5 of 5).
          schema:
            type: boolean
            default: false
        - name: offset
          in: query
          description: How many matching Cards to skip.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: The page size.
          schema:
            type: integer
            minimum: 1
            maximum: 48
            default: 12
        - name: seed
          in: query
          description: Shuffle the matching collection with this seed.
          schema:
            $ref: '#/components/schemas/ShuffleSeed'
      responses:
        '200':
          description: A page of matching Cards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardPage'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [Cards]
      operationId: createCard
      summary: Create a Card
      description: |
        Creates a Card with Progress 0, first in the default order. Fields
        are trimmed; blank values are rejected. Duplicate questions are
        allowed. The Category is matched to an existing one ignoring letter
        case and surrounding whitespace (keeping that Category's spelling),
        or created. A `400` names each rejected field in `fieldErrors`.

        A Collection holds at most 1,000 Cards; creating one more answers
        `409` with `quota_exceeded`, even when requests race for the last
        place.

        Send a fresh `Idempotency-Key` for each Card you mean to create, and
        the same key when retrying it (say, after a lost response). For 24
        hours the backend remembers the creation under your account, this
        operation and the key: repeating it with the same body answers the
        original `201` again, with `Idempotent-Replayed: true`, without
        creating another Card or using quota. Reusing the key with a
        different body answers `422`. After 24 hours the key is forgotten,
        and a request with it creates a new Card.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardInput'
      responses:
        '201':
          description: The created Card, or the one this key created before.
          headers:
            Location:
              description: The Card's URL.
              schema:
                type: string
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/QuotaExceeded'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/cards/statistics:
    get:
      tags: [Cards]
      operationId: getCardStatistics
      summary: Count matching Cards by Progress
      description: |
        Counts every Card that matches the Category filter, whatever its
        Progress, page or shuffled place: `notStarted` (Progress 0),
        `inProgress` (1 to 4) and `mastered` (5) add up to `total`.
      parameters:
        - name: category
          in: query
          description: |
            Category identifiers, as for listing Cards. A Card counts when
            its Category is any of them. Omit to count every Category.
            Identifiers that name no Category match nothing.
          schema:
            type: array
            items:
              $ref: '#/components/schemas/CategoryId'
          style: form
          explode: true
      responses:
        '200':
          description: The counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardStatistics'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/cards/{cardId}:
    parameters:
      - name: cardId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CardId'
    get:
      tags: [Cards]
      operationId: getCard
      summary: Get one Card
      responses:
        '200':
          description: The Card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags: [Cards]
      operationId: updateCard
      summary: Edit a Card's content or Category
      description: |
        Updates the given fields, with the same rules as creation, if the
        Card is still at the `contentVersion` named in `If-Match`, and
        advances its `contentVersion`. The Card keeps its identifier,
        Progress and place in the default order. A Category left without
        Cards ceases to exist. A `400` names each rejected field in
        `fieldErrors`.

        If the Card has been edited since (another device, say), the edit
        answers `409` with `version_conflict` and changes nothing: of two
        edits based on the same version, at most one succeeds. A Card that
        doesn't exist, or isn't yours, answers `404`; a stale edit never
        recreates a deleted Card.

        Retrying with the same `Idempotency-Key` and request answers the
        original `200` again (`Idempotent-Replayed: true`) for 24 hours,
        even after later edits or the Card's deletion. That Card is as it
        was then: refetch rather than display it over newer data.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardPatch'
      responses:
        '200':
          description: The updated Card, or the one this key updated before.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags: [Cards]
      operationId: deleteCard
      summary: Delete a Card
      description: |
        Permanently deletes the Card and its Progress, if it is still at the
        `contentVersion` named in `If-Match`. A Category left without Cards
        ceases to exist, and the Card's place in the 1,000-Card quota is
        free at once. There is no trash and no restore.

        If the Card's content has been edited since, the deletion answers
        `409` with `version_conflict` and deletes nothing. A Card that
        doesn't exist, or isn't yours, answers `404`.

        Retrying with the same `Idempotency-Key` and `If-Match` answers the
        original `204` again (`Idempotent-Replayed: true`) for 24 hours.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: The Card was deleted, by this request or by this key before.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/cards/{cardId}/progress:
    parameters:
      - name: cardId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CardId'
    put:
      tags: [Cards]
      operationId: setCardProgress
      summary: Set a Card's Progress
      description: |
        Sets the Card's Progress to the given value: one more to credit an
        "I Know This", 0 to reset it. The value is absolute, so repeating
        the request changes nothing more. The Card keeps its identifier,
        content, Category and place in the default order. A `400` names
        each rejected field in `fieldErrors`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressInput'
      responses:
        '200':
          description: The updated Card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Card'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/categories:
    get:
      tags: [Categories]
      operationId: listCategories
      summary: List every Category with its Card count
      description: |
        Counts are global: they cover every Card, whatever filters or pages
        a client is showing. Categories are ordered by name.
      responses:
        '200':
          description: All Categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  schemas:
    CardId:
      type: string
      minLength: 1
      description: A Card's stable, opaque identifier.
    CategoryId:
      type: string
      minLength: 1
      description: A Category's stable, opaque identifier.
    ShuffleSeed:
      type: integer
      minimum: 0
      maximum: 4294967295
      description: A 32-bit unsigned shuffle seed.
    ContentVersion:
      type: integer
      minimum: 1
      maximum: 9007199254740991
      description: |
        The version of a Card's content (question, answer, Category):
        1 when created, one more after each edit. Progress changes leave it.
    Progress:
      type: integer
      minimum: 0
      maximum: 5
      description: Study Progress; 5 means Mastered.
    CategoryRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/CategoryId'
        name:
          type: string
          minLength: 1
    Card:
      type: object
      additionalProperties: false
      required: [id, question, answer, category, progress, contentVersion]
      properties:
        id:
          $ref: '#/components/schemas/CardId'
        question:
          type: string
          minLength: 1
        answer:
          type: string
          minLength: 1
        category:
          $ref: '#/components/schemas/CategoryRef'
        progress:
          $ref: '#/components/schemas/Progress'
        contentVersion:
          $ref: '#/components/schemas/ContentVersion'
    CardPage:
      type: object
      additionalProperties: false
      required: [items, total, offset, limit, nextOffset]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Card'
        total:
          type: integer
          minimum: 0
          description: How many Cards match the filters, across all pages.
        offset:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        nextOffset:
          description: The `offset` of the next page, or null on the last page.
          oneOf:
            - type: integer
              minimum: 1
            - type: 'null'
    CardInput:
      type: object
      additionalProperties: false
      required: [question, answer, category]
      properties:
        question:
          type: string
          description: Trimmed; must not be blank; at most 2,000 characters.
        answer:
          type: string
          description: Trimmed; must not be blank; at most 10,000 characters.
        category:
          type: string
          description: |
            A Category name. Trimmed; must not be blank; at most 100
            characters.
    CardPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      description: The fields to change; at least one.
      properties:
        question:
          type: string
          description: Trimmed; must not be blank; at most 2,000 characters.
        answer:
          type: string
          description: Trimmed; must not be blank; at most 10,000 characters.
        category:
          type: string
          description: |
            A Category name. Trimmed; must not be blank; at most 100
            characters.
    ProgressInput:
      type: object
      additionalProperties: false
      required: [progress]
      properties:
        progress:
          $ref: '#/components/schemas/Progress'
    CardStatistics:
      type: object
      additionalProperties: false
      required: [total, notStarted, inProgress, mastered]
      properties:
        total:
          type: integer
          minimum: 0
          description: How many Cards match the Category filter.
        notStarted:
          type: integer
          minimum: 0
          description: How many of them have Progress 0.
        inProgress:
          type: integer
          minimum: 0
          description: How many of them have Progress 1 to 4.
        mastered:
          type: integer
          minimum: 0
          description: How many of them have Progress 5.
    Category:
      type: object
      additionalProperties: false
      required: [id, name, count]
      properties:
        id:
          $ref: '#/components/schemas/CategoryId'
        name:
          type: string
          minLength: 1
        count:
          type: integer
          minimum: 1
          description: How many Cards are in the Category.
    CategoryList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    Error:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - validation_failed
            - unauthorized
            - not_found
            - quota_exceeded
            - idempotency_key_reused
            - version_conflict
            - server_error
            - not_implemented
        message:
          type: string
        fieldErrors:
          type: object
          description: Messages keyed by body field or query parameter name.
          additionalProperties:
            type: string

  securitySchemes:
    clerkSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Clerk session token for the signed-in person.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Identifies this intended write across retries: 16 to 128 letters,
        digits, `-` or `_`, such as a UUID. Send a fresh key for each write
        you mean to make, and the same key when retrying it. Keys are scoped
        to your account and the operation.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{16,128}$'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        The Card's `contentVersion` this write is based on, as a quoted
        entity tag: `"3"`.
      schema:
        type: string
        pattern: '^"[1-9][0-9]{0,15}"$'

  headers:
    IdempotentReplayed:
      description: |
        `true` when this repeats the result of an earlier request with the
        same key.
      schema:
        type: string
        enum: ['true']

  responses:
    ValidationFailed:
      description: The request is invalid; `fieldErrors` says why.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No Card has this identifier.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: |
        The request has no session token, or one that is expired, malformed
        or otherwise invalid. Sign in again.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    QuotaExceeded:
      description: The Collection already holds 1,000 Cards.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    VersionConflict:
      description: |
        The Card has changed since the version named in `If-Match`; nothing
        was changed. Fetch it again to review the latest version.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    IdempotencyKeyReused:
      description: The `Idempotency-Key` was used for a different request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotImplemented:
      description: This backend does not support the operation yet.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServerError:
      description: The server failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
